AWSTemplateFormatVersion: "2010-09-09"
Description: Psychometric assessment backend (Lambda + public Function URL). Code is pushed by the workflow after the stack exists.

Parameters:
  OpenAIApiKey:
    Type: String
    NoEcho: true
  OpenAIModel:
    Type: String
    Default: gpt-5.5
  OpenAITimeoutSeconds:
    Type: String
    Default: "15"

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/psychometric-assessment-backend
      RetentionInDays: 30

  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"

  Function:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: psychometric-assessment-backend
      Runtime: python3.11
      Handler: lambda_function.handler
      Architectures: [x86_64]
      MemorySize: 128
      Timeout: 30
      Role: !GetAtt Role.Arn
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
          OPENAI_MODEL: !Ref OpenAIModel
          OPENAI_TIMEOUT_SECONDS: !Ref OpenAITimeoutSeconds
          DEBUG: "false"
      # Placeholder only: the workflow replaces it with the real zip right after.
      Code:
        ZipFile: |
          def handler(event, context):
              return {"statusCode": 503, "body": "code not deployed yet"}

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt Function.Arn
      AuthType: NONE

  UrlInvokeUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  UrlInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Value: !GetAtt Url.FunctionUrl
