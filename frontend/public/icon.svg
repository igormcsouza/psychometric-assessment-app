<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="128" cy="128" r="128" fill="#0f172a"/>

  <!-- Inner gradient circle -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Five point radar/pentagon representing the Big Five traits -->
  <!-- Points at: top, top-right, bottom-right, bottom-left, top-left -->

  <!-- Center circle -->
  <circle cx="128" cy="128" r="20" fill="url(#iconGradient)" opacity="0.8"/>

  <!-- Five main points (representing the Big Five traits) -->
  <!-- Top -->
  <circle cx="128" cy="68" r="14" fill="url(#iconGradient)"/>
  <!-- Top-right -->
  <circle cx="178" cy="90" r="14" fill="url(#iconGradient)"/>
  <!-- Bottom-right -->
  <circle cx="167" cy="156" r="14" fill="url(#iconGradient)"/>
  <!-- Bottom-left -->
  <circle cx="89" cy="156" r="14" fill="url(#iconGradient)"/>
  <!-- Top-left -->
  <circle cx="78" cy="90" r="14" fill="url(#iconGradient)"/>

  <!-- Connecting lines forming a pentagon -->
  <line x1="128" y1="68" x2="178" y2="90" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="178" y1="90" x2="167" y2="156" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="167" y1="156" x2="89" y2="156" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="89" y1="156" x2="78" y2="90" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="78" y1="90" x2="128" y2="68" stroke="url(#accentGradient)" stroke-width="2" opacity="0.6"/>

  <!-- Inner connecting lines to center -->
  <line x1="128" y1="68" x2="128" y2="128" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
  <line x1="178" y1="90" x2="128" y2="128" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
  <line x1="167" y1="156" x2="128" y2="128" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
  <line x1="89" y1="156" x2="128" y2="128" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
  <line x1="78" y1="90" x2="128" y2="128" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>
</svg>